name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax check
        run: |
          status=0
          while IFS= read -r f; do php -l "$f" > /dev/null || status=1; done \
            < <(find frontend backend start.php -name '*.php' -not -path '*/vendor/*')
          exit $status
      - name: JavaScript syntax check
        run: for f in frontend/assets/js/*.js; do node --check "$f"; done
      - name: Shell syntax check
        run: bash -n backend/tests/http-smoke.sh

  test:
    name: Tests (PHP ${{ matrix.php }}${{ matrix.no-mbstring && ', no mbstring' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
        no-mbstring: [false]
        include:
          - php: "8.1"
            no-mbstring: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: v7shield_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.no-mbstring && 'pdo_mysql, :mbstring' || 'pdo_mysql, mbstring' }}
          coverage: none
      - name: Install schema
        run: mysql -h 127.0.0.1 -uroot -proot v7shield_test < backend/database/schema.sql
      - name: Run tests
        env:
          V7SHIELD_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=v7shield_test;charset=utf8mb4
          V7SHIELD_TEST_USER: root
          V7SHIELD_TEST_PASS: root
        run: php -d error_reporting=-1 -d display_errors=1 backend/tests/run.php

  e2e:
    name: End-to-end HTTP
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: v7shield
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
          coverage: none
      - name: Install schema
        run: mysql -h 127.0.0.1 -uroot -proot v7shield < backend/database/schema.sql
      - name: Create fixture site and config
        run: |
          php -r '
            $site = getenv("RUNNER_TEMP") . "/site";
            @mkdir("$site/uploads", 0755, true);
            $o = "<" . "?php ";
            file_put_contents("$site/index.php", $o . "echo \"hello\";");
            file_put_contents("$site/uploads/c.php", $o . "ev" . "al(base" . "64_decode(\"eA==\"));");
            file_put_contents("$site/uploads/a.jpg", "\xFF\xD8\xFF\xE0" . $o . "sys" . "tem(\$_GET[\"c\"]);");
            $cfg = [
              "database" => ["dsn" => "mysql:host=127.0.0.1;port=3306;dbname=v7shield;charset=utf8mb4", "username" => "root", "password" => "root"],
              "users" => ["ci-admin" => password_hash("ci-password-123456", PASSWORD_DEFAULT)],
              "targets" => ["ci-site" => ["label" => "CI fixture", "path" => $site]],
            ];
            file_put_contents(getenv("RUNNER_TEMP") . "/config.local.php", "<?php return " . var_export($cfg, true) . ";");
          '
      - name: Start server
        run: |
          V7SHIELD_CONFIG="$RUNNER_TEMP/config.local.php" PHP_CLI_SERVER_WORKERS=4 \
            php -S 127.0.0.1:8000 -t frontend backend/dev-router.php > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/login.php && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Smoke tests
        env:
          BASE: http://127.0.0.1:8000
          V7_USER: ci-admin
          V7_PASS: ci-password-123456
          V7_TARGET: ci-site
        run: backend/tests/http-smoke.sh
      - name: Check server log for PHP errors
        if: always()
        run: |
          cat "$RUNNER_TEMP/server.log" | tail -50
          ! grep -iE "PHP (Warning|Fatal|Deprecated|Notice)|Segmentation" "$RUNNER_TEMP/server.log"
