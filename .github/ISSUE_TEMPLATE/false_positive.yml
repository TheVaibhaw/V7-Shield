name: False positive
description: A rule flagged legitimate code
labels: ["false-positive", "detection-rule"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: V7-OBF-003
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where does the file come from?
      placeholder: WordPress plugin "example-cache" v2.1 (wordpress.org)
    validations:
      required: true
  - type: textarea
    id: excerpt
    attributes:
      label: Evidence excerpt shown by V7-Shield
      render: text
  - type: textarea
    id: why
    attributes:
      label: Why is it legitimate?
